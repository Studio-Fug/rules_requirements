# Presubmit hooks — run with `pre-commit run --all-files` (or `prek`).
exclude: ^(python/rules_requirements/_vendor/|tests/integration/report\.golden\.|examples/.*/report\.golden\.)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^python/rules_requirements/
        pass_filenames: false
        args: [--config-file=pyproject.toml]
        additional_dependencies: [pytest]

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.3
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [--ignore-words-list=ser]

  - repo: local
    hooks:
      - id: spdx-header
        name: SPDX license header
        entry: python3 tools/check_spdx.py
        language: system
        types_or: [python, rust, c++, c]
