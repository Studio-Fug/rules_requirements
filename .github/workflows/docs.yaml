name: Docs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a Pages deployment half-way; superseded branch builds may go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt -e ".[test]"
      - name: Sphinx (warnings are errors, docutils messages too)
        # -W misses docutils messages printed outside Sphinx's logger (a
        # broken --help text in the CLI reference): docs_build.py fails on
        # any "WARNING/" line and any rendered problematic node.
        run: python tools/docs_build.py -W -n --keep-going -b html docs docs/_build/html

      - name: Coverage badge
        if: env.PUBLISH == 'true'
        run: |
          coverage run -m pytest -q
          coverage json -o coverage.json
          python - <<'PY'
          import json, os
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = next(c for limit, c in ((90, "brightgreen"), (80, "green"), (70, "yellowgreen"),
                                          (60, "yellow"), (0, "red")) if pct >= limit)
          os.makedirs("docs/_build/html/badges", exist_ok=True)
          with open("docs/_build/html/badges/coverage.json", "w") as fh:
              json.dump({"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color}, fh)
          print(f"coverage {pct:.1f}%")
          PY
          # Sphinx's githubpages extension already writes this; keep it explicit.
          touch docs/_build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        if: env.PUBLISH == 'true'
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
