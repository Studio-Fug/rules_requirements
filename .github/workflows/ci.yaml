name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Coverage summary
        if: matrix.python == '3.12'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Line coverage: {rate:.1f}%")
          PY

  bazel:
    name: Bazel ${{ matrix.bazel }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        bazel: ["7.7.1", "8.8.1"]
        include:
          - os: macos-latest
            bazel: "8.8.1"
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bazel-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
      - run: bazel test //...
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ matrix.os }}-${{ matrix.bazel }}
          path: bazel-testlogs/**/test.log

  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install dist/*.whl
          /tmp/wheel/bin/rr validate tests/integration/model.yaml
          /tmp/wheel/bin/python -c "import rules_requirements._vendor.yaml, rules_requirements.hooks.pytest_plugin"
