name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      # The codemod's black-layout tests fail, rather than skip, without black.
      RR_REQUIRE_BLACK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      # `coverage run` (not pytest-cov): the installed pytest11 entry point
      # imports the package before pytest-cov would start measuring.
      - run: coverage run -m pytest
      - run: coverage report --fail-under=90 && coverage xml
      - name: Coverage summary
        if: matrix.python == '3.12'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Line coverage: {rate:.1f}%")
          PY

  node:
    # rr_node_test's runner reads node:test's reporter events; pin their shape
    # on every Node line the runner supports.
    name: node:test conformance (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 runs the fallback (one synthetic result); the others per case.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: pip install -e ".[test]"
      # RR_NODE_MIN: a node that is missing or unreadable fails the job
      # instead of skipping every test.
      - run: RR_NODE="$(command -v node)" RR_NODE_MIN="${{ matrix.node }}" pytest -rs python/tests/test_node_runner.py

  bazel:
    name: Bazel ${{ matrix.bazel }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        bazel: ["7.7.1", "8.8.1"]
        include:
          - os: macos-latest
            bazel: "8.8.1"
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bazel-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
      - run: bazel test //...
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ matrix.os }}-${{ matrix.bazel }}
          path: bazel-testlogs/**/test.log

  example:
    name: Example (thermostat, Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["7.7.1", "8.8.1"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    defaults:
      run:
        working-directory: examples/thermostat
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: example-${{ matrix.bazel }}
          repository-cache: true
      - run: bazel test //...
      - run: bazel build //:report
      - uses: actions/upload-artifact@v4
        if: always() && matrix.bazel == '8.8.1'
        with:
          name: thermostat-report
          path: examples/thermostat/bazel-bin/report.*

  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install dist/*.whl
          /tmp/wheel/bin/rr validate tests/integration/model.yaml
          /tmp/wheel/bin/python -c "import rules_requirements._vendor.yaml, rules_requirements.hooks.pytest_plugin"
          /tmp/wheel/bin/rr --version | grep -q "0.2.0"
          XML_OUTPUT_FILE=/tmp/c.xml /tmp/wheel/bin/rr case --name x --requirement REQ-1
          grep -q 'value="REQ-1"' /tmp/c.xml
          /tmp/wheel/bin/rr cases --evidence python/tests/fixtures/migrate/pyrepo/evidence
          /tmp/wheel/bin/rr migrate plan --model python/tests/fixtures/migrate/pyrepo/requirements \
            --evidence python/tests/fixtures/migrate/pyrepo/evidence --out /tmp/p.rrplan
          test -s /tmp/p.rrplan
      - name: Smoke-test migrate apply (and its collection check) from the wheel
        run: |
          /tmp/wheel/bin/pip install pytest
          cp -r python/tests/fixtures/migrate/pyrepo /tmp/pyrepo
          cd /tmp/pyrepo
          # exits 1: the fixture has a file the codemod refuses on purpose
          /tmp/wheel/bin/rr migrate apply decided.rrplan --stage tags --dry-run --partial > /tmp/apply.log 2>&1 || true
          cat /tmp/apply.log
          grep -q "would rewrite app/tests/test_config.py" /tmp/apply.log
          ! grep -q -e "Pass --no-collect-check" -e "collection check refused" /tmp/apply.log
